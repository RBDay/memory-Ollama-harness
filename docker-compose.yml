services:
  # database 
  mongo:
    image: mongo:7.0
    container_name: harness-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  mongo-express:
    image: mongo-express:latest
    container_name: harness-mongo-express
    ports:
      - "127.0.0.1:8081:8081" #<---- solo accesible desde localhost
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
    restart: always

  # El servidor de S3 local (MinIO) --> para los ficheros de LanceDB
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: local-minio
    ports:
      - "9000:9000"   # Puerto de la API S3
      - "9001:9001"   # Panel web de administración de MinIO
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minioadminpassword"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped


  # Puente: Ollama escucha solo en localhost del host. Este relay expone el
  # endpoint únicamente en la puerta de enlace Docker y lo reenvía a localhost.
  ollama-proxy:
    image: alpine/socat
    container_name: harness-ollama-proxy
    network_mode: host
    command:
      - "TCP-LISTEN:11434,bind=${OLLAMA_DOCKER_GATEWAY:-172.17.0.1},reuseaddr,fork"
      - "TCP:127.0.0.1:11434"
    restart: unless-stopped

  #api local
  api:
    build:
      context: ./API
    container_name: harness-api
    ports:
      - "8001:8000"
    depends_on:
      - mongo
      - ollama-proxy
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
      - MODEL_NAME=qwen2.5-coder:7b
      - EMBEDDING_MODEL=nomic-embed-text
      - MONGO_URI=mongodb://mongo:27017/
      - DATABASE_NAME=memory
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_BUCKET=lancedb
      - MINIO_REGION=us-east-1
    volumes:
      - ./API/app:/app/app
    restart: always

  #servicio de CLI para los commands
  cli:
    build:
      context: ./CLI
    container_name: harness-cli
    depends_on:
      - api
    stdin_open: true
    tty: true
    entrypoint: []
    command: tail -f /dev/null   # Mantiene el contenedor encendido
    environment:
      - API_URL=http://api:8000/api/v1

volumes:
  mongo-data:
  minio_data: